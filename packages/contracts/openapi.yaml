openapi: 3.1.0
info:
  title: SaaS Boilerplate API
  version: 1.0.0
  description: >-
    Framework-independent contract (docs/backend-contract.md). Any backend
    serves any frontend: NestJS today, FastAPI tomorrow. Error envelope
    everywhere: { error, issues? }. Auth: session cookie, credentials:include.
servers:
  - url: http://localhost:3001
    description: Local API (dual-server E2E)
tags:
  - name: organizations
    description: Multi-tenancy / orgs (spec 3, faza 2.2)
  - name: locale
    description: Explicit language choice (spec 16.1, faza 2.8)
  - name: admin
    description: Super-admin panel (spec 6, faza 2.6). Cross-tenant by design; SuperAdminGuard is the boundary.
  - name: dashboard
    description: Personal revenue dashboard (etap 4, faza 3). Tenant-local by design — aggregates over the caller's personal account only.
  - name: calendar
    description: >-
      Calendar events (etap 5, faza 5.3). Owner is the caller's personal
      account, or — when `org` is supplied — an org they are a member of.
      Times are UTC instants; the frontend renders them in the active context's
      time zone.
  - name: mail
    description: >-
      Internal mail (etap 5, faza 5.4). USER-scoped threads/messages/folders/
      flags between platform users — no inbound MX, so sends to an address with
      no account are refused. Delivery of a new thread runs as the
      `mail.deliver` job.
paths:
  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: Revenue aggregates, series and plan breakdown for the caller's personal account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/dashboard/transactions:
    get:
      operationId: listDashboardTransactions
      tags: [dashboard]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, paid, failed, refunded], default: all }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        "200":
          description: Personal payments, newest first
          content:
            application/json:
              schema:
                type: object
                required: [rows, page, hasNext]
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/DashboardTransaction"
                  page: { type: integer }
                  hasNext: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/organizations:
    post:
      operationId: createOrganization
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      operationId: listOrganizations
      tags: [organizations]
      responses:
        "200":
          description: Orgs of the caller
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationWithRole"
  /v1/organizations/{slug}:
    get:
      operationId: getOrganization
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
      responses:
        "200":
          description: Single org with caller role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationWithRole"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateOrganization
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "409":
          $ref: "#/components/responses/SlugTaken"
    delete:
      operationId: deleteOrganization
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
      responses:
        "204":
          description: Soft-deleted
  /v1/organizations/{slug}/members:
    get:
      operationId: listMembers
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
      responses:
        "200":
          description: Members newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
  /v1/organizations/{slug}/members/{memberId}:
    patch:
      operationId: updateMemberRole
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
        - name: memberId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleInput"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "409":
          $ref: "#/components/responses/LastOwner"
    delete:
      operationId: removeMember
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
        - name: memberId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: Removed
        "409":
          $ref: "#/components/responses/LastOwner"
  /v1/organizations/{slug}/membership:
    delete:
      operationId: leaveOrganization
      tags: [organizations]
      description: Delete own membership (leave). Distinct from removeMember (actor = target, audit member.leave).
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
      responses:
        "204":
          description: Left
        "409":
          $ref: "#/components/responses/LastOwner"
  /v1/organizations/{slug}/invitations:
    post:
      operationId: createInvitation
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationInput"
      responses:
        "201":
          description: Invited (mail only enqueued — delivery in faza 2.3)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
    get:
      operationId: listInvitations
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
        - name: status
          in: query
          schema: { type: string, enum: [pending], default: pending }
      responses:
        "200":
          description: Pending invitations newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
  /v1/organizations/{slug}/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
        - name: invitationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: Revoked (idempotent — already-revoked also 204, no audit row)
  /v1/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [organizations]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [slug]
                properties:
                  slug: { type: string }
        "400":
          $ref: "#/components/responses/InvalidToken"
  /v1/invitations/{token}:
    get:
      operationId: lookupInvitation
      tags: [organizations]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: >-
            Public validity read for the accept landing (spec 3.3, faza 2.8).
            No session by design. `valid: false` covers every dead end
            (unknown/used/expired token, missing org, orgs disabled) alike.
          content:
            application/json:
              schema:
                type: object
                required: [valid, orgName, role]
                properties:
                  valid: { type: boolean }
                  orgName: { type: string, nullable: true }
                  role: { type: string, nullable: true }
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/locale:
    patch:
      operationId: setLocale
      tags: [locale]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale: { type: string, enum: [en, pl] }
      responses:
        "200":
          description: Stored choice saved (the cookie half is the web route's)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "401":
          description: No valid session
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/organizations/{slug}/audit-logs:
    get:
      operationId: listOrgAuditLogs
      tags: [organizations]
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        "200":
          description: Tenant-scoped audit trail (spec 6.4)
          content:
            application/json:
              schema:
                type: object
                required: [items, page, hasNext]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrgAuditRow"
                  page: { type: integer }
                  hasNext: { type: boolean }
  /v1/admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema: { type: string, enum: [all, active, suspended, deleted], default: all }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        "200":
          description: Every account, newest first (spec 6.2)
          content:
            application/json:
              schema:
                type: object
                required: [rows, page, hasNext]
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
                  page: { type: integer }
                  hasNext: { type: boolean }
  /v1/admin/users/{id}:
    get:
      operationId: getAdminUser
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Account detail with memberships and cascade disclosure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "404":
          $ref: "#/components/responses/UserNotFound"
  /v1/admin/organizations:
    get:
      operationId: listAdminOrganizations
      tags: [admin]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        "200":
          description: Every org with metrics (spec 6.2)
          content:
            application/json:
              schema:
                type: object
                required: [rows, page, hasNext]
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminOrg"
                  page: { type: integer }
                  hasNext: { type: boolean }
  /v1/admin/organizations/{id}:
    get:
      operationId: getAdminOrganization
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Org detail with members and revenue (spec 6.2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrgDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/audit:
    get:
      operationId: listAdminAudit
      tags: [admin]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        "200":
          description: Global audit trail, newest first (spec 6.3)
          content:
            application/json:
              schema:
                type: object
                required: [rows, page, hasNext]
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminAuditRow"
                  page: { type: integer }
                  hasNext: { type: boolean }
  /v1/admin/users/{id}/suspend:
    post:
      operationId: suspendUser
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendInput"
      responses:
        "200":
          description: Suspended
  /v1/admin/users/{id}/unsuspend:
    post:
      operationId: unsuspendUser
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Reactivated
  /v1/admin/users/{id}/delete:
    post:
      operationId: deleteUser
      tags: [admin]
      description: Soft-delete with solely-owned org cascade (Rule A transaction)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Deleted
  /v1/admin/organizations/{id}/delete:
    post:
      operationId: deleteOrganization
      tags: [admin]
      description: Soft-delete (Rule A transaction)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Deleted
  /v1/admin/users/{id}/super-admin:
    post:
      operationId: setSuperAdmin
      tags: [admin]
      description: Grant/revoke the system flag. Audit-first (Rule B); last admin is not revokable (409 LAST_ADMIN).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSuperAdminInput"
      responses:
        "200":
          description: Flag updated
        "409":
          $ref: "#/components/responses/LastAdmin"
  /v1/calendar/events:
    get:
      operationId: listCalendarEvents
      tags: [calendar]
      description: >-
        Events intersecting the [from, to) window (stabbing query). Personal
        scope by default; `org` selects an org the caller is a member of.
      parameters:
        - name: org
          in: query
          schema: { type: string, minLength: 1, maxLength: 48 }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Events ordered by start time
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CalendarEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createCalendarEvent
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        "400":
          description: End is not after start
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/calendar/events/{id}:
    patch:
      operationId: updateCalendarEvent
      tags: [calendar]
      description: >-
        Partial update. The `org` owner hint travels as a query param: a bare id
        cannot name its tenant, and mismatched hints answer 404 rather than
        scanning tenants.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: org
          in: query
          schema: { type: string, minLength: 1, maxLength: 48 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "200":
          description: Updated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteCalendarEvent
      tags: [calendar]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: org
          in: query
          schema: { type: string, minLength: 1, maxLength: 48 }
      responses:
        "200":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/mail/threads:
    get:
      operationId: listMailThreads
      tags: [mail]
      description: The caller's threads in a folder/label, newest first, optionally filtered by search or unread.
      parameters:
        - name: folder
          in: query
          schema:
            type: string
            enum: [inbox, sent, drafts, spam, trash, archive]
        - name: label
          in: query
          schema:
            type: string
            enum: [social, updates, forums, shopping, promotions]
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: unread
          in: query
          schema: { type: string, enum: ["1", "true", "0", "false"] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Threads in the mailbox view
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MailThreadSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: sendMail
      tags: [mail]
      description: Compose a new thread, or a draft when `draft` is true. Unknown recipients answer 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailSendInput"
      responses:
        "201":
          description: Thread created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        "422":
          description: Unknown recipient (issues.to) or schema failure
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/mail/counts:
    get:
      operationId: getMailCounts
      tags: [mail]
      responses:
        "200":
          description: Per-folder and per-label counts plus the inbox unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailCounts"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/mail/threads/{id}:
    get:
      operationId: getMailThread
      tags: [mail]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Thread with my flags, its messages and the other participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailThreadDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMailThread
      tags: [mail]
      description: Update MY copy — folder, read/star flags or labels. Moving a draft to `sent` delivers it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailUpdateInput"
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid folder/label
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMailThread
      tags: [mail]
      description: Remove my copy of the thread; the thread survives for the other participants.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/mail/threads/{id}/messages:
    post:
      operationId: replyMailThread
      tags: [mail]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailReplyInput"
      responses:
        "201":
          description: Reply appended
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    OrgSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        minLength: 2
        maxLength: 48
  schemas:
    Organization:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        timezone: { type: string }
    OrganizationWithRole:
      allOf:
        - $ref: "#/components/schemas/Organization"
        - type: object
          required: [role]
          properties:
            role: { type: string }
    Member:
      type: object
      required: [id, userId, email, role, status]
      properties:
        id: { type: string }
        userId: { type: string }
        email: { type: string }
        name: { type: string, nullable: true }
        role: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, email, role, status]
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
    OrgAuditRow:
      type: object
      required: [id, action, actorType, actorEmail, targetType, targetLabel, createdAt]
      properties:
        id: { type: string }
        action: { type: string }
        actorType: { type: string }
        actorEmail: { type: string }
        targetType: { type: string }
        targetLabel: { type: string }
        metadata: { type: object, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateOrganizationInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, minLength: 2, maxLength: 48 }
    UpdateOrganizationInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        newSlug: { type: string, minLength: 2, maxLength: 48 }
        timezone: { type: string, description: IANA timezone name }
    CreateInvitationInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member], default: member }
    UpdateMemberRoleInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [owner, admin, member] }
    AdminUser:
      type: object
      required: [id, email, name, emailVerified, isSuperAdmin, status, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        emailVerified: { type: boolean }
        isSuperAdmin: { type: boolean }
        status: { type: string, enum: [active, suspended, deleted] }
        createdAt: { type: string, format: date-time }
    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
        - type: object
          required: [orgs, solelyOwnedOrgs]
          properties:
            banReason: { type: string, nullable: true }
            deletedAt: { type: string, format: date-time, nullable: true }
            orgs:
              type: array
              items:
                type: object
                required: [id, name, slug, role, status]
                properties:
                  id: { type: string }
                  name: { type: string }
                  slug: { type: string }
                  role: { type: string }
                  status: { type: string }
            solelyOwnedOrgs:
              type: array
              items:
                type: object
                required: [id, name, slug]
                properties:
                  id: { type: string }
                  name: { type: string }
                  slug: { type: string }
    AdminOrg:
      type: object
      required: [id, name, slug, memberCount, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        memberCount: { type: integer }
        planId: { type: string, nullable: true }
        subscriptionStatus: { type: string, nullable: true }
        seats: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
    AdminOrgDetail:
      allOf:
        - $ref: "#/components/schemas/AdminOrg"
        - type: object
          required: [members, revenue]
          properties:
            members:
              type: array
              items:
                type: object
                required: [userId, email, name, role, status]
                properties:
                  userId: { type: string }
                  email: { type: string }
                  name: { type: string }
                  role: { type: string }
                  status: { type: string }
            revenue:
              type: array
              items:
                type: object
                required: [currency, netMinor]
                properties:
                  currency: { type: string }
                  netMinor: { type: integer }
    AdminAuditRow:
      type: object
      required: [id, action, actorType, actorEmail, targetType, targetId, targetLabel, createdAt]
      properties:
        id: { type: string }
        action: { type: string }
        actorType: { type: string }
        actorEmail: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        targetLabel: { type: string }
        metadata: { type: object, nullable: true }
        createdAt: { type: string, format: date-time }
    SuspendInput:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }
    SetSuperAdminInput:
      type: object
      required: [value]
      properties:
        value: { type: string, enum: [grant, revoke] }
    DashboardSummary:
      type: object
      required:
        [currency, revenue, subscriptions, payments, monthlyRevenue, weeklyRevenue, planBreakdown]
      properties:
        currency: { type: string }
        revenue:
          type: object
          required: [totalMinor, previousMinor, deltaPct]
          properties:
            totalMinor: { type: integer }
            previousMinor: { type: integer }
            deltaPct: { type: number, nullable: true }
        subscriptions:
          type: object
          required: [active, trialing, pastDue, canceled]
          properties:
            active: { type: integer }
            trialing: { type: integer }
            pastDue: { type: integer }
            canceled: { type: integer }
        payments:
          type: object
          required: [paid, failed, refunded]
          properties:
            paid: { type: integer }
            failed: { type: integer }
            refunded: { type: integer }
        monthlyRevenue:
          type: array
          items:
            type: object
            required: [month, minor]
            properties:
              month: { type: string }
              minor: { type: integer }
        weeklyRevenue:
          type: array
          items:
            type: object
            required: [weekStart, minor]
            properties:
              weekStart: { type: string }
              minor: { type: integer }
        planBreakdown:
          type: array
          items:
            type: object
            required: [planId, count, minor]
            properties:
              planId: { type: string, nullable: true }
              count: { type: integer }
              minor: { type: integer }
    DashboardTransaction:
      type: object
      required: [id, amountMinor, currency, status, reason, createdAt]
      properties:
        id: { type: string }
        amountMinor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [paid, failed, refunded] }
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CalendarEvent:
      type: object
      required:
        [id, title, description, startsAt, endsAt, allDay, kind, location, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        allDay: { type: boolean }
        kind: { type: string }
        location: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CalendarEventInput:
      type: object
      required: [title, startsAt, endsAt]
      properties:
        org: { type: string, minLength: 1, maxLength: 48 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        allDay: { type: boolean }
        kind: { type: string, maxLength: 40 }
        location: { type: string, maxLength: 200 }
    MailThreadSummary:
      type: object
      required:
        [
          id,
          subject,
          folder,
          isRead,
          isStarred,
          labels,
          messageCount,
          lastMessageAt,
          preview,
          counterpartName,
          counterpartEmail,
        ]
      properties:
        id: { type: string }
        subject: { type: string }
        folder:
          type: string
          enum: [inbox, sent, drafts, spam, trash, archive]
        isRead: { type: boolean }
        isStarred: { type: boolean }
        labels:
          type: array
          items:
            type: string
            enum: [social, updates, forums, shopping, promotions]
        messageCount: { type: integer }
        lastMessageAt: { type: string, format: date-time }
        preview: { type: string }
        counterpartName: { type: string, nullable: true }
        counterpartEmail: { type: string }
    MailMessage:
      type: object
      required: [id, body, createdAt, fromName, fromEmail, isFromMe]
      properties:
        id: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        fromName: { type: string, nullable: true }
        fromEmail: { type: string }
        isFromMe: { type: boolean }
    MailThreadDetail:
      type: object
      required: [id, subject, folder, isRead, isStarred, labels, createdAt, messages, participants]
      properties:
        id: { type: string }
        subject: { type: string }
        folder:
          type: string
          enum: [inbox, sent, drafts, spam, trash, archive]
        isRead: { type: boolean }
        isStarred: { type: boolean }
        labels:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MailMessage"
        participants:
          type: array
          items:
            type: object
            required: [userId, name, email]
            properties:
              userId: { type: string }
              name: { type: string, nullable: true }
              email: { type: string }
    MailCounts:
      type: object
      required: [folders, labels, unread]
      properties:
        folders:
          type: object
          additionalProperties: { type: integer }
        labels:
          type: object
          additionalProperties: { type: integer }
        unread: { type: integer }
    MailSendInput:
      type: object
      required: [to, subject, body]
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: email }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 20000 }
        draft: { type: boolean }
    MailUpdateInput:
      type: object
      properties:
        folder:
          type: string
          enum: [inbox, sent, drafts, spam, trash, archive]
        isRead: { type: boolean }
        isStarred: { type: boolean }
        labels:
          type: array
          items:
            type: string
            enum: [social, updates, forums, shopping, promotions]
    MailReplyInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 20000 }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
        issues:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
  responses:
    ValidationFailed:
      description: Schema failure
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                required: [issues]
    Unauthorized:
      description: Missing or invalid session (SessionGuard)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Unknown org slug, or orgs disabled (indistinguishable by design)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LastOwner:
      description: Demote/remove/leave of the last active owner
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [LAST_OWNER] }
    SlugTaken:
      description: Slug already taken (incl. soft-deleted orgs)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [SLUG_TAKEN] }
    InvalidToken:
      description: Invitation expired/used/forged (one code)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [INVALID_TOKEN] }
    UserNotFound:
      description: Unknown user id
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [USER_NOT_FOUND] }
    LastAdmin:
      description: Revoking the last super admin
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [LAST_ADMIN] }
