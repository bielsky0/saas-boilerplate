# Local development services (spec 11 Postgres + spec 21/25 MinIO object store)
# + faza 2.9: usługa `api` (Nest na :3001, obraz z `apps/api/Dockerfile`).
# `pnpm db:up` starts them, `pnpm db:down` stops them.
#
# VPS (prod) jedzie na TYM SAMYM pliku: `docker compose up -d --build`, tylko
# ze środowiskowymi nadpisami (nigdy commita z sekretami):
#   BETTER_AUTH_URL=https://api.<domena>      # linki mailowe biją wprost w Nest
#   NEXT_PUBLIC_APP_URL=https://app.<domena>  # redirecty + CORS + trustedOrigins
#   CROSS_SUBDOMAIN_COOKIES=true + SESSION_COOKIE_DOMAIN=.<domena>
#   DATABASE_URL=... (baza VPS-owa), BETTER_AUTH_SECRET / CRON_SECRET (prod),
#   EMAIL_* (resend), S3_* (realny bucket) lub STORAGE_PROVIDER=none,
#   BILLING_* (stripe live). Migracje: DATABASE_URL=<baza-VPS> pnpm db:migrate
#   (z dowolnej maszyny z repo — `db:migrate` ma `cache: false`, turbo.json).
# Web zostaje na Vercelu z API_BASE_URL=https://api.<domena>.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: saas_boilerplate_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    # Sekrety z lokalnego `apps/api/.env` (gitignored); reszta to jawne
    # defaulty dev — `environment` wygrywa z `env_file`.
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      # W sieci compose hostem bazy jest `postgres`, nie localhost.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/saas_boilerplate
      BETTER_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    healthcheck:
      # node:22-slim nie ma curl/wget — Node 22 ma wbudowany fetch.
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3001/v1/health'').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: saas_boilerplate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_boilerplate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_boilerplate"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local S3-compatible object storage (spec 21.1 / 25.1). The storage adapter
  # points at this instead of AWS S3 in dev — no code change, only S3_* env
  # (that is the whole point of hiding storage behind an adapter, §1.2).
  minio:
    image: minio/minio:latest
    container_name: saas_boilerplate_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the bucket and make ONLY the `public/` prefix anonymously
  # readable (spec 21.3 — public files by stable URL, private files never). Exits
  # after running; re-running is idempotent.
  minio_init:
    image: minio/mc:latest
    container_name: saas_boilerplate_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/saas-boilerplate &&
      mc anonymous set download local/saas-boilerplate/public &&
      echo 'minio bucket ready'
      "

volumes:
  postgres_data:
  minio_data:
